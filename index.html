<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes System Design</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>QuickNotes</h1>
        <p>Your notes, connected to an API.</p>
    </header>

    <main class="container">
        <section class="panel">
            <h2>Load notes</h2>
            <button id="load-btn" type="button">Load notes</button>
            <p id="status" role="status" aria-live="polite">
                Click "Load notes" to fetch notes from the server.
            </p>
        </section>

        <section class="panel">
            <h2>Create a note</h2>

            <form id="note-form">
                <label for="title-input">Title</label>
                <input
                    type="text"
                    id="title-input"
                    maxlength="100"
                    required
                >

                <label for="body-input">Note body (optional)</label>
                <textarea id="body-input" rows="4"></textarea>

                <button id="submit-btn" type="submit">
                    Create note
                </button>
            </form>
        </section>

        <section class="panel">
            <h2>Your notes</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>
</body>
</html>
